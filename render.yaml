# Blueprint de Render: Dashboard → New → Blueprint → este repo. Cada push a main redespliega.
services:
  - type: web
    name: hackaton-back
    runtime: node
    plan: free
    branch: main
    # tsx (devDependency) es el runtime de `npm start`, así que se instalan también las de desarrollo.
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

  # Agente IA (Groq). Vive en la rama `agente`, carpeta agente/ (paquete aparte, no toca el back).
  - type: web
    name: hackaton-agente
    runtime: node
    plan: free
    branch: agente
    rootDir: agente
    buildCommand: npm ci --include=dev
    startCommand: npm run servidor
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FUENTE
        value: http
      - key: BACKEND_URL
        value: https://hackaton-back-7z3l.onrender.com/api
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_RESPALDO
        value: openai/gpt-oss-20b
      # Secreto: Render lo pide al sincronizar el Blueprint. Nunca va en el repo.
      - key: GROQ_API_KEY
        sync: false
